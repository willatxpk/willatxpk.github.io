<path d="M800,330 C780,312 786,290 800,268 C806,288 822,294 812,316 C818,308 822,300 820,292 C830,306 824,324 800,330 Z" fill="#fff1c4"/>
<text x="800" y="640" text-anchor="middle" font-family="Cinzel" font-size="132" font-weight="700" font-style="normal" letter-spacing="12" fill="#f1b84d" filter="url(#soft)" opacity=".55">GLOAMREACH</text>
<text x="800" y="640" text-anchor="middle" font-family="Cinzel" font-size="132" font-weight="700" font-style="normal" letter-spacing="12" fill="url(#gold)" >GLOAMREACH</text>
<text x="800" y="712" text-anchor="middle" font-family="Cormorant Garamond" font-size="44" font-weight="500" font-style="italic" letter-spacing="0" fill="#bba57c" >The things in the dark were people once.</text>
